[workspace]
members = [
    "core/common",
    "core/project",
    "core/indexer",
    "core/search",
    "core/watcher",
    "core/storage",
    "core/viewer",
    "core/wiki",
    "core/ai_agent",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Full-text search
tantivy = "0.22"

# Embeddings
fastembed = "4"

# File watching
notify = "7"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
